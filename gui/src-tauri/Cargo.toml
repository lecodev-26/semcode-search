[package]
name = "semcode-search-gui"
version = "3.0.0"
description = "Semcode Search GUI"
authors = ["Manuel <lecodev-26@github.com>"]
edition = "2021"
rust-version = "1.75"

[lib]
name = "semcode_search_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = "0.4"
dirs = "5"
toml = "0.8"
regex = "1"
num_cpus = "1"

# Nuestra librería principal
semcode-search = { path = "../..", default-features = false }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
ai = ["semcode-search/ai"]
server = ["semcode-search/server"]
