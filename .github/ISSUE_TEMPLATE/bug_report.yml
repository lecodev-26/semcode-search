name: Bug report
description: Report a reproducible problem with semcode-search.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "3.0.0"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS / platform
      placeholder: "Windows, Ubuntu, macOS, Termux..."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Remove secrets and private information.
      render: shell
