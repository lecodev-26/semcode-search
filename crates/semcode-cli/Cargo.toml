[package]
name = "semcode-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Interfaz de línea de comandos de semcode-search"

[[bin]]
name = "semcode-search"
path = "src/main.rs"

[lib]
name = "semcode_cli"
path = "src/lib.rs"

[dependencies]
semcode-core = { path = "../semcode-core" }
semcode-parser = { path = "../semcode-parser" }
semcode-embeddings = { path = "../semcode-embeddings", optional = true }
semcode-index = { path = "../semcode-index" }
semcode-search = { path = "../semcode-search" }
semcode-mcp = { path = "../semcode-mcp", optional = true }
semcode-server = { path = "../semcode-server", optional = true }

clap = { workspace = true }
colored = { workspace = true }
indicatif = { workspace = true }
dialoguer = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir.workspace = true
ignore.workspace = true
rusqlite.workspace = true

[features]
default = ["fastembed"]
fastembed = ["semcode-embeddings/fastembed", "dep:semcode-embeddings"]
openai = ["semcode-embeddings/openai"]
ollama = ["semcode-embeddings/ollama"]
server = ["dep:semcode-server"]
mcp = ["dep:semcode-mcp"]
full = ["fastembed", "openai", "ollama", "server", "mcp"]

[dev-dependencies]
tempfile.workspace = true
