[package]
name = "semcode-index"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Persistencia: SQLite + FTS5 + vectores + cache"

[dependencies]
semcode-core = { path = "../semcode-core" }
semcode-parser = { path = "../semcode-parser" }
semcode-embeddings = { path = "../semcode-embeddings", default-features = false }

rusqlite = { workspace = true }
r2d2 = { workspace = true }
r2d2_sqlite = { workspace = true }
hnsw_rs = { workspace = true, optional = true }

blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
chrono.workspace = true
tracing.workspace = true
walkdir = { workspace = true }
ignore = { workspace = true }
num_cpus.workspace = true

[features]
default = []
hnsw = ["dep:hnsw_rs"]
