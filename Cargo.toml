[package]
name = "semcode-search"
version = "3.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["Manuel <lecodev-26@github.com>"]
description = "Fast semantic code search CLI with TF-IDF ranking, caching, and advanced filtering"
license = "MIT"
repository = "https://github.com/lecodev-26/semcode-search"
readme = "README.md"
keywords = [
    "semantic-search",
    "code-search",
    "search",
    "cli",
    "tf-idf"
]
categories = [
    "command-line-utilities",
    "development-tools"
]

[features]
default = []
ai = ["fastembed"]
server = ["axum", "tokio"]
tui = ["ratatui", "crossterm"]
full = ["ai", "server", "tui"]

[dependencies]
clap = { version = "4.5", features = ["derive", "color"] }
colored = "2.1"
walkdir = "2.4"
anyhow = "1.0"
ignore = "0.4"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
byte-unit = "5.1"
glob = "0.3"
toml = "0.8"
dirs = "5.0"
rayon = "1.8"
thiserror = "1.0"

# IA real (opcional)
fastembed = { version = "4", optional = true }

# Servidor HTTP (opcional)
axum = { version = "0.7", optional = true }
tokio = { version = "1", features = ["full"], optional = true }

# TUI (opcional)
ratatui = { version = "0.29", optional = true }
crossterm = { version = "0.28", optional = true }

[dev-dependencies]
tempfile = "3.9"
assert_cmd = "2.0"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[[bench]]
name = "search_benchmark"
harness = false