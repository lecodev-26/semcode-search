[workspace]
resolver = "2"
members = [
    "crates/semcode-core",
    "crates/semcode-parser",
    "crates/semcode-embeddings",
    "crates/semcode-index",
    "crates/semcode-search",
    "crates/semcode-cli",
    "crates/semcode-mcp",
    "crates/semcode-server",
]

[workspace.package]
version = "4.0.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Manuel <echeparesmanuel36@gmail.com>"]
repository = "https://github.com/lecodev-26/semcode-search"
homepage = "https://github.com/lecodev-26/semcode-search"

[workspace.dependencies]
# Core
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
schemars = "0.8"

# Async / paralelismo
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal", "sync"] }
rayon = "1.10"
futures = "0.3"

# Hashing
sha2 = "0.10"
blake3 = "1"

# Fechas
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SQLite
rusqlite = { version = "0.32", features = ["bundled", "blob", "vtab"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Vector index
hnsw_rs = "0.3"

# Tree-sitter
tree-sitter = "0.24"
tree-sitter-rust = "0.23"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-json = "0.23"
tree-sitter-toml-ng = "0.6"
tree-sitter-yaml = "0.6"
tree-sitter-md = "0.3"
tree-sitter-bash = "0.23"
tree-sitter-html = "0.23"
tree-sitter-css = "0.23"

# Embeddings
fastembed = "5"
ndarray = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# CLI
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
colored = "3"
indicatif = "0.17"
dialoguer = "0.11"

# HTTP server
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "trace", "limit"] }

# MCP
rmcp = "0.2"

# Utilidades
regex = "1.11"
globset = "0.4"
walkdir = "2.5"
ignore = "0.4"
unicode-segmentation = "1"
once_cell = "1"
dirs = "5"
byte-unit = "5"
num_cpus = "1"

# Testing / benchmarks
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
pretty_assertions = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
